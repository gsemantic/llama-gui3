# Грамматики tree-sitter — единственный источник правды.
#
# Почему файл, а не файлы в репозитории: полные клоны грамматик весят
# 172 МБ, и почти всё это — тестовые корпуса upstream (`php/` 10 МБ,
# `php_only/` 10 МБ), которые сборка не компилирует: `CMakeLists.txt`
# берёт только `src/*.c`. Класть в историю 172 МБ ради 13 МБ нужного —
# цена, которую каждый клон платит вечно.
#
# Как это работает: `CMakeLists.txt` при настройке, если грамматика не
# найдена ни через `pkg-config`, ни в `deps/`, берёт строку отсюда и
# делает shallow-клон по закреплённому sha. Явно и без сети:
#     make fetch-grammars
# Отключить: cmake -DWP_CODER_FETCH_GRAMMARS=OFF
#
# Формат строки: <язык> <url> <sha> [комментарий]
# Пин — это sha, а не тег: тег upstream можно переставить, и тогда клон
# молча собрал бы другую грамматику. Все восемь плинов взяты из
# upstream, чьими коммитами собирается этот репозиторий.
#
# язык       url                                            sha
c           https://github.com/tree-sitter/tree-sitter-c          b125bec9b331722e4eaab6e02e1fe5b14eefd967  # v0.21.0
cpp         https://github.com/tree-sitter/tree-sitter-cpp        d0b4e006ca3c4466f834d9a4bf709bfede13d359  # v0.21.0
python      https://github.com/tree-sitter/tree-sitter-python     0f9047c857ed0990931b1f899c7d3bf403703147  # v0.21.0
rust        https://github.com/tree-sitter/tree-sitter-rust       473634230435c18033384bebaa6d6a17c2523281  # v0.21.0
php         https://github.com/tree-sitter/tree-sitter-php        3fda2fb9577166c6399834917f9844f30370beea  # package.json 0.24.2
javascript  https://github.com/tree-sitter/tree-sitter-javascript 58404d8cf191d69f2674a8fd507bd5776f46cb11  # package.json 0.25.0
css         https://github.com/tree-sitter/tree-sitter-css        dda5cfc5722c429eaba1c910ca32c2c0c5bb1a3f  # v0.25.0
